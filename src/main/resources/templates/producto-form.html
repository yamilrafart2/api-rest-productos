<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Formulario de Producto')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="main-content">
    <section class="card form-container" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario" class="form-title"
            th:text="${producto.id == null ? 'Crear Producto' : 'Editar Producto'}"></h2>

        <form th:action="@{/web/productos/guardar}" th:object="${producto}" method="POST">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <!-- th:classappend añade la clase input-error si hay errores en 'nombre' -->
                <input type="text" id="nombre" th:field="*{nombre}"
                       th:classappend="${#fields.hasErrors('nombre')} ? 'input-error' : ''"/>

                <span th:if="${#fields.hasErrors('nombre')}" class="error-text">
                        <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span th:errors="*{nombre}"></span>
                    </span>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" th:field="*{descripcion}" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" id="precio" step="0.01" th:field="*{precio}"
                       th:classappend="${#fields.hasErrors('precio')} ? 'input-error' : ''"/>

                <span th:if="${#fields.hasErrors('precio')}" class="error-text">
                        <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path
                                stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span th:errors="*{precio}"></span>
                    </span>
            </div>

            <fieldset class="form-actions" aria-label="Acciones del formulario">
                <button type="submit" class="btn btn-primary flex-1">Guardar</button>
                <a th:href="@{/web/productos}" class="btn btn-outline flex-1 text-center">Cancelar</a>
            </fieldset>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
