<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Formulario de Producto')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="main-content">
    <section class="card form-container" aria-labelledby="titulo-formulario">
        <h2 id="titulo-formulario" class="form-title"
            th:text="${producto.id == null ? 'Crear Producto' : 'Editar Producto'}"></h2>

        <form th:action="@{/web/productos/guardar}" th:object="${producto}" method="POST">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}"/>
                <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="error-text"></span>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción:</label>
                <input type="text" id="descripcion" th:field="*{descripcion}"/>
            </div>

            <div class="form-group">
                <label for="precio">Precio:</label>
                <input type="number" id="precio" step="0.01" th:field="*{precio}"/>
                <span th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}" class="error-text"></span>
            </div>

            <fieldset class="form-actions" aria-label="Acciones del formulario">
                <button type="submit" class="btn btn-primary flex-1">Guardar</button>
                <a th:href="@{/web/productos}" class="btn btn-outline flex-1 text-center">Cancelar</a>
            </fieldset>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
