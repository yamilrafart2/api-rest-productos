<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Lista de Productos')}"></head>
<body>
<div class="toast-container" th:if="${msgExito != null}">
    <div class="toast">
        <svg style="width: 1.5rem; height: 1.5rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <span th:text="${msgExito}"></span>
    </div>
</div>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="main-content">
    <section class="card" aria-labelledby="titulo-gestion">
        <header class="card-header">
            <h2 id="titulo-gestion">Gestión de Productos</h2>
            <a th:href="@{/web/productos/nuevo}" class="btn btn-primary" aria-label="Crear un nuevo producto">
                <svg style="width: 1.2rem; height: 1.2rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nuevo Producto
            </a>
        </header>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nombre</th>
                    <th scope="col">Descripción</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Fecha Creación</th>
                    <th scope="col">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.id}"></td>
                    <td th:text="${producto.nombre}"></td>
                    <td th:text="${producto.descripcion}"></td>
                    <td th:text="${producto.precio}"></td>
                    <td th:text="${#temporals.format(producto.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>
                    <td class="actions">
                        <a th:href="@{/web/productos/editar/{id}(id=${producto.id})}" class="btn btn-primary"
                           aria-label="Editar producto">
                            <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                            Editar
                        </a>

                        <button type="button" class="btn btn-danger" aria-label="Eliminar producto"
                                th:data-url="@{/web/productos/eliminar/{id}(id=${producto.id})}"
                                onclick="abrirModalEliminar(this.getAttribute('data-url'))">
                            <svg style="width: 1rem; height: 1rem;" fill="none" stroke="currentColor"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            Eliminar
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<div id="modalEliminar" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">Eliminar Producto</div>
        <div class="modal-body">¿Estás seguro de eliminar este producto? Esta acción es permanente y no se puede
            deshacer.
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="cerrarModalEliminar()">Cancelar</button>
            <button class="btn btn-danger" onclick="confirmarEliminacion()">Sí, Eliminar</button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
