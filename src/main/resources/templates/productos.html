<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
</head>
<body>
<h1>Gestión de Productos</h1>
<a th:href="@{/web/productos/nuevo}">Crear Nuevo Producto</a>
<br><br>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
        <th>Fecha Creación</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="producto : ${productos}">
        <td th:text="${producto.id}"></td>
        <td th:text="${producto.nombre}"></td>
        <td th:text="${producto.descripcion}"></td>
        <td th:text="${producto.precio}"></td>
        <td th:text="${#temporals.format(producto.fechaCreacion, 'dd/MM/yyyy HH:mm')}"></td>

        <!-- Botones de acción -->
        <td>
            <!-- Pasa el ID en la URL de Thymeleaf -->
            <a th:href="@{/web/productos/editar/{id}(id=${producto.id})}">Editar</a> |

            <!-- Confirm de JavaScript para evitar borrados accidentales -->
            <a th:href="@{/web/productos/eliminar/{id}(id=${producto.id})}"
               onclick="return confirm('¿Estás seguro de eliminar este producto?');">
                Eliminar
            </a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
