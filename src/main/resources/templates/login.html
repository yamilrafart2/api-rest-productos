<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Iniciar Sesión')}"></head>
<body class="login-body">
<main class="login-container">
    <header style="text-align: center; margin-bottom: 2rem;">
        <svg style="width: 3.5rem; height: 3.5rem; color: var(--primary-color); margin-bottom: 1rem;" fill="none"
             stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
        </svg>
        <h2 class="login-title" style="margin-bottom: 0.5rem;">Gestión de Productos</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Ingresa tus credenciales para acceder al panel de
            administración.</p>
    </header>

    <section aria-live="polite">
        <div th:if="${param.error}" class="alert alert-error" role="alert">
            Usuario o contraseña incorrectos.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="status">
            Has cerrado sesión exitosamente.
        </div>
    </section>

    <form th:action="@{/login}" method="POST" aria-label="Formulario de inicio de sesión">
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus aria-required="true">
        </div>
        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required aria-required="true">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
</main>
</body>
</html>
