<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Proyecto</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="navbar" class="main-header">
    <nav class="main-nav" aria-label="Navegación principal">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <svg style="width: 1.75rem; height: 1.75rem; color: var(--primary-color);" fill="none" stroke="currentColor"
                 viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
            <h1 class="main-title">Sistema de Inventario</h1>
        </div>

        <div style="display: flex; align-items: center; gap: 1.5rem;">
            <div style="font-size: 0.95rem; color: #4b5563;">
                <svg style="width: 1.2rem; height: 1.2rem; vertical-align: middle; margin-right: 0.25rem;" fill="none"
                     stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                <span sec:authentication="name" style="font-weight: 600; color: #111827;">Usuario</span>
            </div>

            <form th:action="@{/logout}" method="post" class="logout-form" id="logoutForm" style="margin: 0;">
                <button type="button" class="btn btn-link" aria-label="Cerrar sesión" onclick="abrirModalLogout()">
                    <svg style="width: 1.2rem; height: 1.2rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                    Cerrar Sesión
                </button>
            </form>
        </div>
    </nav>

    <div id="modalLogout" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">Cerrar Sesión</div>
            <div class="modal-body">¿Estás seguro de que deseas cerrar tu sesión actual?</div>
            <div class="modal-footer">
                <button class="btn btn-outline" onclick="cerrarModalLogout()">Cancelar</button>
                <button class="btn btn-danger" onclick="confirmarLogout()">Cerrar Sesión</button>
            </div>
        </div>
    </div>
</header>
</body>
</html>
