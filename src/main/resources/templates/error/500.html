<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Error Interno - 500')}"></head>
<body>
<div th:replace="~{fragments/header :: navbar}"></div>

<main class="main-content" style="align-items: center; justify-content: center; padding-top: 4rem;">
    <section class="card" style="text-align: center; max-width: 500px; margin: 0 auto;">
        <svg style="width: 4rem; height: 4rem; color: #ef4444; margin: 0 auto 1.5rem auto;" fill="none"
             stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h2 style="margin-bottom: 1rem;">500 - Error Interno</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Ocurrió un problema inesperado en el servidor al
            procesar tu solicitud. Inténtalo de nuevo más tarde.</p>
        <a th:href="@{/web/productos}" class="btn btn-primary" style="display: inline-flex; width: auto;">
            Volver al Inicio
        </a>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
